name: license-scanner CI

on:
  push:
    branches:
      - main
    paths:
      - 'lambdas/license_scanner/**'
      - 'lambdas/offboarding_workflow/**'
      - 'terraform/aws-license-reclaim/**'
      - 'terraform/aws-offboarding/**'
      - 'scripts/licenses/**'
      - 'config/licenses/**'
      - 'config/jira/field-mapping.json'
      - 'tests/unit/test_license_scanner_infra_contract.py'
      - '.github/workflows/license-scanner-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'lambdas/license_scanner/**'
      - 'lambdas/offboarding_workflow/**'
      - 'terraform/aws-license-reclaim/**'
      - 'terraform/aws-offboarding/**'
      - 'scripts/licenses/**'
      - 'config/licenses/**'
      - 'config/jira/field-mapping.json'
      - 'tests/unit/test_license_scanner_infra_contract.py'
      - '.github/workflows/license-scanner-ci.yml'

concurrency:
  group: license-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: pytest (scanner + offboarding emit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            lambdas/license_scanner/requirements-dev.txt
            lambdas/offboarding_workflow/requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r lambdas/license_scanner/requirements-dev.txt
          pip install -r lambdas/offboarding_workflow/requirements-dev.txt
      - name: pytest license scanner
        run: pytest lambdas/license_scanner/tests -v
      - name: pytest scanner infra error-handling contract
        run: pytest tests/unit/test_license_scanner_infra_contract.py -v
      - name: pytest offboarding (leaver.completed emit)
        run: pytest lambdas/offboarding_workflow/tests -v

  build-zip:
    name: build Lambda zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash lambdas/license_scanner/build.sh
      - run: test -f lambdas/license_scanner/build/handler.zip

  terraform-validate:
    name: terraform fmt + validate (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - terraform/aws-license-reclaim
          - terraform/aws-offboarding
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build license scanner zip
        if: matrix.stack == 'terraform/aws-license-reclaim'
        run: bash lambdas/license_scanner/build.sh
      - name: Build offboarding zip
        if: matrix.stack == 'terraform/aws-offboarding'
        run: bash lambdas/offboarding_workflow/build.sh
      - working-directory: ${{ matrix.stack }}
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate -no-color

  python-syntax:
    name: py_compile (handler + scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m py_compile lambdas/license_scanner/handler.py
          python -m py_compile scripts/licenses/http_util.py
          python -m py_compile scripts/licenses/github_client.py
          python -m py_compile scripts/licenses/linear_client.py
          python -m py_compile scripts/licenses/jira_client.py
          python -m py_compile scripts/licenses/scan_cli.py
          python -m py_compile lambdas/offboarding_workflow/handler.py
